[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selflearn"
version = "0.1.0"
description = "Production-grade long-term memory for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Self-Learning Agents contributors" }]
keywords = ["ai-agents", "llm", "long-term-memory", "agent-memory", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "build>=1.0",
]

[project.scripts]
selflearn = "selflearn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=selflearn --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["selflearn"]
omit = ["*/tests/*"]
